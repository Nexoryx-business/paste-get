[package]
name = "pasteget-desktop"
description = "paste-get desktop daemon and command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pasteget"
path = "src/main.rs"

[dependencies]
anstream = "1"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "7"
gethostname = "1"
if-addrs = "0.15.0"
image = { version = "0.25", default-features = false, features = ["png"] }
mdns-sd = "0.21"
pasteget-core = { path = "../core" }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }
