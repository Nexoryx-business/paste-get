[package]
name = "pasteget-desktop"
description = "paste-get desktop daemon and command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pasteget"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "7"
gethostname = "1"
pasteget-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
