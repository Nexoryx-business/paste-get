[package]
name = "pasteget-desktop"
description = "paste-get desktop daemon and command-line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "pasteget"
path = "src/main.rs"

[dependencies]
anstream = "1"
anyhow = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
dirs = "7"
gethostname = "1"
if-addrs = "0.15.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mdns-sd = "0.21"
pasteget-core = { path = "../core" }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The Run key, for starting at login.
windows-registry = "0.6"

# Notifications: Windows toasts and macOS through notify-rust, the freedesktop D-Bus service
# elsewhere (KDE Plasma, mako, dunst, swaync…).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
notify-rust = { version = "4", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }
# Reading D-Bus signal streams (the hotkey portal).
futures-util = { version = "0.3", default-features = false }
