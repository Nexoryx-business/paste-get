# cargo-deny: dependency policy. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
# Known vulnerabilities and unmaintained crates fail the build.
yanked = "deny"
ignore = [
    # basic-toml is archived (no vulnerability). Only reached through askama, the template engine
    # uniffi_bindgen uses at build time to generate Kotlin; it never ships in the app or daemon.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi_bindgen/askama" },
]

[licenses]
# Licenses compatible with GPL-3.0-or-later. Add new ones only after checking compatibility.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    # Boost: permissive, GPL-compatible per the FSF. Used by clipboard-win.
    "BSL-1.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not a mirror of current dependencies.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement.
allow-wildcard-paths = true

[sources]
# Only crates.io. Git dependencies must be added here explicitly.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
