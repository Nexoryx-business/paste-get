[package]
name = "pasteget-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pasteget-core = { path = "../core" }

# Kept out of the main workspace: fuzzing needs a nightly toolchain.
[workspace]

[[bin]]
name = "frame_decoder"
path = "fuzz_targets/frame_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pairing_invite"
path = "fuzz_targets/pairing_invite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "clip_receiver"
path = "fuzz_targets/clip_receiver.rs"
test = false
doc = false
bench = false
