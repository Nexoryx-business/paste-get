[package]
name = "pasteget-core"
description = "Protocol, crypto, pairing and history shared by every paste-get app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The clipboard history (`history` module). Off unless an app asks for it, so the other crates
# don't build SQLite.
history = ["dep:miniz_oxide", "dep:rusqlite", "dep:unicode-normalization"]

[dependencies]
bytes = "1"
data-encoding = "2"
form_urlencoded = "1"
# Tries a pairing code's addresses at once (`FuturesUnordered`).
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Deflates long texts in the history.
miniz_oxide = { version = "0.9", optional = true }
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
# SQLite built from its C source with `cc` (FTS5 included), so phone and PC run the same version:
# Android's own SQLite is as old as 3.22 on Android 10 and lacks the trigram tokenizer.
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "functions"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
# Takes accents off letters for the history's search, the way SQLite's tokenizer does.
unicode-normalization = { version = "0.1", optional = true }
tracing = "0.1"
zeroize = "1"

[build-dependencies]
prost-build = "0.14"
protox = "0.10"

[dev-dependencies]
# Finds an address of this machine other than loopback, to dial it in a pairing test.
if-addrs = "0.15"
proptest = "1"
tempfile = "3"
# Captures logs to check they never hold clip contents.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"] }
