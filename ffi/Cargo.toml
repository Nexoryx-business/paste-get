[package]
name = "pasteget-ffi"
description = "paste-get core for the Android app, exposed through UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the .so loaded by the Android app. lib: so tests and the bindings generator can use it.
crate-type = ["cdylib", "lib"]

[lints]
workspace = true

[dependencies]
pasteget-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
uniffi = "0.32"

[dev-dependencies]
pasteget-desktop = { path = "../desktop" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread"] }
